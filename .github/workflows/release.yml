name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump (patch, minor, major, or specific version like 1.0.18)'
        required: false
        type: string
        default: 'patch'
      publish_marketplace:
        description: 'Publish to VS Code Marketplace'
        required: false
        type: boolean
        default: true
      publish_ovsx:
        description: 'Publish to Open VSX'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync & Bump Package Version and Changelog
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_bump }}" ]; then
            npm version ${{ inputs.version_bump }} --no-git-tag-version
            VER=$(node -p "require('./package.json').version")
            node scripts/update-changelog.js "$VER"
            git add package.json package-lock.json CHANGELOG.md 2>/dev/null || git add package.json CHANGELOG.md
            git commit -m "chore(release): bump version to ${VER} and update changelog [skip ci]"
            git tag "v${VER}"
            git push origin HEAD:${{ github.ref_name }} --follow-tags
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            TAG_VER="${RAW_TAG#v}"
            npm version "$TAG_VER" --no-git-tag-version --allow-same-version
            VER="$TAG_VER"
            node scripts/update-changelog.js "$VER"
            if ! git diff --quiet package.json CHANGELOG.md; then
              git add package.json package-lock.json CHANGELOG.md 2>/dev/null || git add package.json CHANGELOG.md
              git commit -m "chore(release): sync package.json & changelog to ${VER} [skip ci]" || true
              git push origin HEAD:master || true
            fi
          else
            VER=$(node -p "require('./package.json').version")
            node scripts/update-changelog.js "$VER"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Target package version: ${VER}"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Build production bundle
        run: npm run build

      - name: Package extension (.vsix)
        run: |
          rm -f *.vsix
          npx @vscode/vsce package --no-dependencies --no-yarn --allow-star-activation

      - name: Locate VSIX artifact
        id: vsix_path
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "file=${VSIX_FILE}" >> "$GITHUB_OUTPUT"
          echo "Found VSIX package: ${VSIX_FILE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix_path.outputs.file }}
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && (github.event_name != 'workflow_dispatch' || inputs.publish_marketplace) }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath ${{ steps.vsix_path.outputs.file }} -p "$VSCE_PAT"

      - name: Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' && (github.event_name != 'workflow_dispatch' || inputs.publish_ovsx) }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish ${{ steps.vsix_path.outputs.file }} -p "$OVSX_PAT"
